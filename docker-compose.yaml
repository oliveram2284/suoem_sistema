services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - app_code:/var/www
    networks:
      - suoem

  web:
    image: nginx:latest
    restart: unless-stopped
    expose:
      - "80"
    environment:
      SERVICE_FQDN_WEB: /
    volumes:
      - app_code:/var/www:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets/fastcgi-php.conf:/etc/nginx/snippets/fastcgi-php.conf:ro
    networks:
      - suoem
    depends_on:
      - app

  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - suoem

volumes:
  app_code:
  postgres_data:

networks:
  suoem: